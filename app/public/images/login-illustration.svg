<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:0.1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63" />
      <stop offset="50%" style="stop-color:#ff6b35" />
      <stop offset="100%" style="stop-color:#4caf50" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="400" cy="150" r="40" fill="url(#accentGradient)" opacity="0.08"/>
  <circle cx="80" cy="400" r="50" fill="url(#accentGradient)" opacity="0.06"/>
  
  <!-- Main illustration container -->
  <g transform="translate(50, 50)">
    <!-- Floating card -->
    <rect x="0" y="0" width="400" height="300" rx="20" fill="url(#cardGradient)" stroke="url(#accentGradient)" stroke-width="2" opacity="0.8" filter="url(#shadow)"/>
    
    <!-- Card content -->
    <g transform="translate(40, 40)">
      <!-- Lock icon -->
      <g transform="translate(160, 80)">
        <!-- Lock body -->
        <rect x="0" y="20" width="80" height="60" rx="8" fill="url(#accentGradient)" opacity="0.9"/>
        <!-- Lock shackle -->
        <path d="M 20 20 Q 20 0 40 0 Q 60 0 60 20" stroke="url(#accentGradient)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <!-- Keyhole -->
        <circle cx="40" cy="50" r="8" fill="white" opacity="0.9"/>
        <rect x="36" y="50" width="8" height="20" fill="white" opacity="0.9"/>
      </g>
      
      <!-- Security shield -->
      <g transform="translate(280, 60)">
        <path d="M 40 0 L 60 10 L 60 40 Q 60 60 40 70 Q 20 60 20 40 L 20 10 Z" fill="url(#accentGradient)" opacity="0.8"/>
        <path d="M 35 25 L 45 25 L 45 35 L 35 35 Z" fill="white" opacity="0.9"/>
        <circle cx="40" cy="45" r="3" fill="white" opacity="0.9"/>
      </g>
      
      <!-- Connection lines -->
      <g stroke="url(#accentGradient)" stroke-width="3" opacity="0.6" fill="none">
        <path d="M 200 120 Q 240 100 280 80" stroke-dasharray="5,5"/>
        <path d="M 200 140 Q 240 160 280 180" stroke-dasharray="5,5"/>
      </g>
    </g>
    
    <!-- Floating elements -->
    <g transform="translate(20, 20)">
      <!-- Email icon -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="40" height="30" rx="4" fill="url(#accentGradient)" opacity="0.7"/>
        <path d="M 0 8 L 20 20 L 40 8" stroke="white" stroke-width="2" fill="none"/>
      </g>
      
      <!-- Phone icon -->
      <g transform="translate(0, 50)">
        <rect x="8" y="0" width="24" height="40" rx="12" fill="url(#accentGradient)" opacity="0.7"/>
        <circle cx="20" cy="35" r="2" fill="white"/>
      </g>
    </g>
    
    <!-- Success checkmark -->
    <g transform="translate(320, 220)">
      <circle cx="0" cy="0" r="25" fill="url(#accentGradient)" opacity="0.9"/>
      <path d="M -8 0 L 0 8 L 12 -8" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Animated elements -->
  <g opacity="0.7">
    <!-- Floating particles -->
    <circle cx="120" cy="350" r="3" fill="url(#accentGradient)">
      <animate attributeName="cy" values="350;320;350" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="380" r="2" fill="url(#accentGradient)">
      <animate attributeName="cy" values="380;350;380" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="420" r="2.5" fill="url(#accentGradient)">
      <animate attributeName="cy" values="420;390;420" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
