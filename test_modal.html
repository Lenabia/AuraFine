<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Modales</title>
    <link href="app/public/css/main.css" rel="stylesheet" />
  </head>
  <body>
    <h1>Test des Modales</h1>

    <button onclick="showLogoutModal()">Test Déconnexion</button>
    <button onclick="showDeleteModal('Test Item', 'cet élément', 'testForm')">
      Test Suppression
    </button>

    <form id="testForm" method="POST">
      <input type="hidden" name="test" value="1" />
    </form>

    <!-- Modales -->
    <div id="deleteModal" class="modal-overlay">
      <div class="modal-container">
        <div class="modal-header">
          <div class="modal-icon">🗑️</div>
          <h3 class="modal-title">Supprimer</h3>
        </div>
        <div class="modal-body">
          <p class="modal-message"></p>
        </div>
        <div class="modal-actions">
          <button
            type="button"
            class="modal-btn modal-btn-cancel"
            onclick="closeModal()"
          >
            Annuler
          </button>
          <button type="button" class="modal-btn modal-btn-confirm">
            Supprimer
          </button>
        </div>
      </div>
    </div>

    <div id="logoutModal" class="modal-overlay">
      <div class="modal-container">
        <div class="modal-header">
          <div class="modal-icon">🚪</div>
          <h3 class="modal-title">Déconnexion</h3>
        </div>
        <div class="modal-body">
          <p class="modal-message">
            Êtes-vous sûr de vouloir vous déconnecter ?
          </p>
        </div>
        <div class="modal-actions">
          <button
            type="button"
            class="modal-btn modal-btn-cancel"
            onclick="closeModal()"
          >
            Annuler
          </button>
          <a href="#" class="modal-btn modal-btn-logout">Déconnexion</a>
        </div>
      </div>
    </div>

    <script src="app/public/js/modal.js"></script>
  </body>
</html>
