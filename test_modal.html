<!DOCTYPE html>
<html>
<head>
    <title>Test Modale</title>
    <style>
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <button onclick="showReactivateModal('Test Quartier', 'ce quartier', 'test-form')">Test Réactiver</button>
    
    <div id="reactivateNeighborhoodModal" class="modal-overlay">
        <div class="modal-container">
            <h3>Réactiver le quartier</h3>
            <p id="reactivateNeighborhoodMessage">Message par défaut</p>
            <button onclick="closeReactivateNeighborhoodModal()">Fermer</button>
        </div>
    </div>

    <script>
        let currentReactivateNeighborhoodFormId = null;

        function showReactivateModal(neighborhoodName, type, formId) {
            currentReactivateNeighborhoodFormId = formId;
            document.getElementById('reactivateNeighborhoodMessage').textContent = 
                `Êtes-vous sûr de vouloir réactiver ${type} "${neighborhoodName}" ?`;
            const modal = document.getElementById('reactivateNeighborhoodModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeReactivateNeighborhoodModal() {
            const modal = document.getElementById('reactivateNeighborhoodModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
            currentReactivateNeighborhoodFormId = null;
        }
    </script>
</body>
</html>
